<style>

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {

button, input, select { font: inherit; color: inherit; }

.top-inner { display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: center; justify-content: space-between; padding: 18px 0 14px; }

.tagline { font-family: Fraunces, serif; font-size: 20px; color: var(--brass-2); margin: 0; }

.foot { color: var(--faint); font-size: 12px; padding: 0 0 28px; }

<script>
const ITEMS = JSON.parse(document.getElementById("catalog").textContent);
const $ = (id) => document.getElementById(id);
const board = $("board");
const modal = $("modal");
let view = "grid";

function gb(bytes) {
  const value = bytes / 1024 / 1024 / 1024;
  return (value >= 10 ? value.toFixed(1) : value.toFixed(2)) + " GB";
}
function display(item) {
  return (item.tmdb && item.tmdb.title) || item.query;
}
function yearOf(item) {
  return (item.tmdb && item.tmdb.year) || item.year_hint || "";
}
function voteOf(item) {
  const vote = item.tmdb && item.tmdb.vote;
  return vote ? Number(vote).toFixed(1) : "";
}
function haystack(item) {
  const t = item.tmdb || {};
  return [
    display(item), t.original_title, t.overview, ...(t.directors || []),
    ...((t.cast || []).map(person => person.name)),
    ...item.files.map(file => file.name), item.query, item.alt
  ].filter(Boolean).join(" ").toLowerCase();
}
function genres() {
  const set = new Set();
  ITEMS.forEach(item => ((item.tmdb && item.tmdb.genres) || []).forEach(genre => set.add(genre)));
  return [...set].sort((a, b) => a.localeCompare(b, "es"));
}
function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const kind = $("kind").value;
  const genre = $("genre").value;
  const sort = $("sort").value;
  let rows = ITEMS.filter(item => {
    if (kind && item.kind !== kind) return false;
    if (genre && !((item.tmdb && item.tmdb.genres) || []).includes(genre)) return false;
    if (q && !haystack(item).includes(q)) return false;
    return true;
  });
  rows.sort((a, b) => {
    if (sort === "year") return (yearOf(b) || 0) - (yearOf(a) || 0);
    if (sort === "vote") return (voteOf(b) || 0) - (voteOf(a) || 0);
    if (sort === "size") return b.size - a.size;
    return display(a).localeCompare(display(b), "es");
  });
  return rows;
}
function poster(item) {
  const url = item.tmdb && item.tmdb.poster;
  return url ? `<img src="${url}" alt="" loading="lazy">` : "";
}
function render() {
  const rows = filtered();
  const movies = ITEMS.filter(item => item.kind === "movie").length;
  const series = ITEMS.length - movies;
  const bytes = ITEMS.reduce((sum, item) => sum + item.size, 0);
  $("stats").innerHTML = `<span><b>${rows.length}</b> en pantalla</span><span><b>${movies}</b> películas</span><span><b>${series}</b> series</span><span><b>${gb(bytes)}</b></span>`;
  if (!rows.length) {
    board.className = "";
    board.innerHTML = `<p class="empty">Nada coincide con ese filtro.</p>`;
    return;
  }
  if (view === "grid") {
    board.className = "grid";
    board.innerHTML = rows.map((item, index) => `
      <button class="card" data-i="${index}">
        <div class="poster">
          ${item.kind === "series" ? `<span class="badge">SERIE</span>` : ""}
          ${poster(item)}
          ${voteOf(item) ? `<span class="vote">${voteOf(item)}</span>` : ""}
        </div>
        <h2>${escapeHtml(display(item))}</h2>
        <p class="meta">${yearOf(item) || "s/f"} · ${item.kind === "series" ? item.file_count + " cap." : gb(item.size)}</p>
      </button>
    `).join("");
  } else {
    board.className = "list";
    board.innerHTML = rows.map((item, index) => `
      <button class="row" data-i="${index}">
        ${item.tmdb && item.tmdb.poster ? `<img src="${item.tmdb.poster}" alt="">` : `<span class="ph"></span>`}
        <b>${escapeHtml(display(item))}</b>
        <span>${yearOf(item) || ""}</span>
        <span class="hide-sm">${escapeHtml(((item.tmdb && item.tmdb.genres) || []).slice(0, 2).join(" · "))}</span>
        <span class="hide-sm">${voteOf(item) || ""}</span>
        <span>${gb(item.size)}</span>
      </button>
    `).join("");
  }
  board._rows = rows;
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}
function runtime(minutes) {
  if (!minutes) return "";
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return h ? `${h} h ${m} min` : `${m} min`;
}
function openItem(item) {
  const t = item.tmdb || {};
  const hero = t.backdrop ? ` style="background-image:url('${t.backdrop}')"` : "";
  const people = (t.cast || []).map(person => `
    <div class="person">
      ${person.profile ? `<img src="${person.profile}" alt="">` : `<div class="avatar">—</div>`}
      <strong>${escapeHtml(person.name)}</strong>
      <em>${escapeHtml(person.character || "")}</em>
    </div>
  `).join("");
  const files = item.files.slice(0, 80).map(file => {
    const ep = file.season != null ? `T${file.season} E${file.episode ?? "?"}${file.episode_title ? " · " + file.episode_title : ""}` : file.name;
    const tech = [file.screen_size, file.source, file.video_codec, file.audio_codec].filter(Boolean).join(" · ");
    return `<div class="file"><div><b>${escapeHtml(ep)}</b><br><small>${escapeHtml(file.relative)}</small></div><small>${gb(file.size)}${tech ? " · " + escapeHtml(tech) : ""}</small></div>`;
  }).join("");
  const more = item.files.length > 80 ? `<p class="meta">Y ${item.files.length - 80} archivos más.</p>` : "";
  $("sheet").innerHTML = `
    <button class="close" type="button" id="close">Cerrar</button>
    <div class="hero"${hero}>
      <div class="hero-inner">
        ${t.poster_large || t.poster ? `<img class="hero-poster" src="${t.poster_large || t.poster}" alt="">` : `<div class="hero-poster"></div>`}
        <div>
          <p class="kicker">${item.kind === "series" ? "SERIE" : "PELÍCULA"} · ${escapeHtml(item.libraries.join(" · "))}</p>
          <h3>${escapeHtml(display(item))}</h3>
          ${t.original_title && t.original_title !== display(item) ? `<p class="original">${escapeHtml(t.original_title)}</p>` : ""}
          <div class="facts">
            ${yearOf(item) ? `<span class="pill">${yearOf(item)}</span>` : ""}
            ${runtime(t.runtime) ? `<span class="pill">${runtime(t.runtime)}</span>` : ""}
            ${voteOf(item) ? `<span class="pill">${voteOf(item)} TMDB${t.votes ? " · " + t.votes + " votos" : ""}</span>` : ""}
            ${(t.genres || []).map(genre => `<span class="pill">${escapeHtml(genre)}</span>`).join("")}
            <span class="pill">${item.file_count} archivo${item.file_count === 1 ? "" : "s"} · ${gb(item.size)}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="body">
      ${t.tagline ? `<p class="tagline">${escapeHtml(t.tagline)}</p>` : ""}
      <p class="overview">${escapeHtml(t.overview || "Sin sinopsis en TMDB para este título.")}</p>
      ${t.directors && t.directors.length ? `<p class="meta">Dirección: ${escapeHtml(t.directors.join(", "))}</p>` : ""}
      ${people ? `<div class="cast">${people}</div>` : ""}
      <div class="links">
        ${t.trailer ? `<a href="${t.trailer}" target="_blank" rel="noopener">Tráiler</a>` : ""}
        ${t.url ? `<a href="${t.url}" target="_blank" rel="noopener">Ficha TMDB</a>` : ""}
        ${t.imdb_id ? `<a href="https://www.imdb.com/title/${t.imdb_id}/" target="_blank" rel="noopener">IMDb</a>` : ""}
      </div>
      <div class="files">${files}${more}</div>
    </div>
  `;
  modal.classList.add("on");
  $("close").onclick = closeModal;
}
function closeModal() { modal.classList.remove("on"); }
board.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-i]");
  if (!button) return;
  openItem(board._rows[Number(button.dataset.i)]);
});
modal.addEventListener("click", (event) => { if (event.target === modal) closeModal(); });
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeModal();
  if (event.key === "/" && document.activeElement !== $("q")) {
    event.preventDefault();
    $("q").focus();
  }
});
["q", "kind", "genre", "sort"].forEach(id => $(id).addEventListener("input", render));
$("view-grid").onclick = () => { view = "grid"; $("view-grid").classList.add("on"); $("view-list").classList.remove("on"); render(); };
$("view-list").onclick = () => { view = "list"; $("view-list").classList.add("on"); $("view-grid").classList.remove("on"); render(); };
genres().forEach(genre => {
  const option = document.createElement("option");
  option.value = genre;
  option.textContent = genre;
  $("genre").appendChild(option);
});
render();
